; ============================================================
; ESP32-C3 多环境传感器监测节点
; Arduino + PlatformIO + FreeRTOS
; ============================================================
; ============================================================
; PlatformIO 工程配置
;
; 目标硬件：ESP32-C3（RISC-V 单核，160MHz，约 320KB SRAM + 4MB Flash）
; 软件栈  ：Arduino Framework + FreeRTOS（Arduino Core 自带）
;
; 常用命令：
;   pio run                 编译
;   pio run -t upload       编译并烧录
;   pio device monitor      打开串口监视器（115200）
;   pio run -t clean        清理构建产物
; ============================================================

[env:esp32-c3-devkitm-1]
; 芯片支持包：首次编译时会自动下载，需要联网
platform  = espressif32
; 开发板定义：决定 Flash 大小、分区表、USB/串口等默认参数
board     = esp32-c3-devkitm-1
; 使用 Arduino API（其内部已封装 FreeRTOS，可直接调用 xTaskCreate 等）
framework = arduino
; 串口监视器波特率，必须与 Serial.begin(115200) 保持一致，否则中文日志乱码
monitor_speed = 115200
; 崩溃时把 PC/回溯地址翻译成函数名和行号，方便定位 HardFault / 看门狗复位
monitor_filters = esp32_exception_decoder

build_flags =
    ; 关闭 Arduino Core 的内部调试日志（0=关闭），避免刷屏；
    ; 需要排查核心库问题时临时改为 5（Verbose）
    -DCORE_DEBUG_LEVEL=0
    ; 固件版本号，会被 MqttManager 的 HA Discovery 用作 sw_version：
    ;   1) 修改版本号后重新编译并 OTA，HA 中可看到新版本
    ;   2) 注意转义：\\\" 最终展开为 "3.1.0"
    -DFW_VERSION=\"3.1.0\"

; 第三方库依赖（PlatformIO 会自动下载到 .pio/libdeps/，不要手动修改）
lib_deps =
    ; MQTT 客户端：轻量、API 简单，但"非线程安全"，使用约束见 MqttManager.h
    knolleary/PubSubClient
    ; JSON 序列化：使用 7.x 的 JsonDocument 自动扩容 API
    bblanchon/ArduinoJson
    ; OLED 驱动（SSD1306）及其图形基础库
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    ; 气压传感器驱动（BMP280）
    adafruit/Adafruit BMP280 Library
    ; AHT20 使用工程内置的 lib/AHT20（本地库，便于修改），故此处注释掉远程依赖
    ; adafruit/AHT20
    ; Adafruit 各传感器库依赖的 I2C/SPI 抽象层，必须显式声明
    adafruit/Adafruit BusIO